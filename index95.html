<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSCode Dashboard</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Sidebar -->
  <div class="flex h-screen">
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
      <div class="p-4 text-2xl font-bold border-b border-gray-700">
        Dashboard
      </div>
    
      <nav class="flex-1 p-4 space-y-2">
  <a href="index95.html" class="block py-2 px-3 rounded hover:bg-gray-700">Home</a>
  <a href="index_project.html" class="block py-2 px-3 rounded hover:bg-gray-700">Projects</a>
  <a href="tasks.html" class="block py-2 px-3 rounded hover:bg-gray-700">Tasks</a>
  <a href="#" class="block py-2 px-3 rounded hover:bg-gray-700">Settings</a>
</nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <h1 class="text-3xl font-bold mb-6">Welcome to Your Dashboard</h1>

      <!-- Cards -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-xl font-semibold">Projects</h2>
          <p class="text-gray-600">Manage your coding projects.</p>
        </div>
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-xl font-semibold">Tasks</h2>
          <p class="text-gray-600">Track your daily tasks.</p>
        </div>
        <div class="bg-white p-4 rounded shadow">
          <h2 class="text-xl font-semibold">Analytics</h2>
          <p class="text-gray-600">View your progress stats.</p>
        </div>
      </div>

      <!-- Table -->
      <div class="mt-8 bg-white rounded shadow p-4">
        <h2 class="text-xl font-semibold mb-4">Recent Activity</h2>
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-gray-200">
              <th class="p-2 text-left">Date</th>
              <th class="p-2 text-left">Activity</th>
              <th class="p-2 text-left">Status</th>
            </tr>
          </thead>
          <tbody id="activityTable">
            <!-- JS will inject rows -->
          </tbody>
        </table>
      </div>
    </main>
  </div>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans">

  <h1 class="text-3xl font-bold">Hello Dashboard</h1>
  <div id="activityTable"></div>
  




  <!-- Link JS file -->
  <script src="script.js"></script>
</body>
</html>
